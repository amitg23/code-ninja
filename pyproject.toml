[project]
name = "code_ninja"
version = "0.1.0"
description = "code-ninja using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
code_ninja = "code_ninja.main:run"
run_crew = "code_ninja.main:run"
train = "code_ninja.main:train"
replay = "code_ninja.main:replay"
test = "code_ninja.main:test"
run_with_trigger = "code_ninja.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv.workspace]
members = [
    "sandbox",
]
